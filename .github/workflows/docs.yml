name: docs

# A build gate. --strict turns MkDocs warnings (dead internal links, missing
# nav targets) into a failed build, so a renamed file or a stale nav entry is
# caught in review. Publishing is handled by the unified docs hub
# (rostamlabs/docs), which imports this repo's docs/ and serves
# docs.rostamlabs.com; this workflow only checks the build and notifies the hub
# to rebuild.

on:
  push:
    branches: [main]
    paths: ['docs/**', 'mkdocs.yml', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', 'mkdocs.yml', '.github/workflows/docs.yml']
  # The paths filter means an unrelated commit will not redeploy. Manual
  # dispatch covers the first publish and any forced re-run.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: pip install mkdocs-material

      - name: Build (strict)
        run: mkdocs build --strict --site-dir _site

      - name: Internal docs must not be published
        # exclude_docs is easy to drop in a merge, and the failure mode is
        # silent publication rather than a broken build -- so assert it.
        run: |
          fail=0
          for path in _site/PRODUCTION-READINESS _site/superpowers; do
            if [ -e "$path" ]; then
              echo "::error::$path was published; it must stay in exclude_docs in mkdocs.yml"
              fail=1
            fi
          done
          exit $fail

      - name: No third-party font requests
        # The theme sets font:false and self-hosts the same faces as the landing
        # page. If that regresses, every page silently gains a Google Fonts
        # request and the shared identity breaks.
        run: |
          if grep -rl "fonts.googleapis.com\|fonts.gstatic.com" _site --include='*.html' | head -1 | grep -q .; then
            echo "::error::pages request Google Fonts; theme.font must stay false"
            exit 1
          fi
          echo "fonts are self-hosted"

  # The unified docs hub (rostamlabs/docs) imports this repo's docs/ at build
  # time and serves docs.rostamlabs.com. On a push to main, fire a
  # repository_dispatch so the hub redeploys immediately instead of waiting for
  # its daily schedule.
  #
  # Requires a repo secret DOCS_DISPATCH_TOKEN — a token with Contents:write on
  # rostamlabs/docs. Guarded on it, so this no-ops (never fails) when absent.
  notify-hub:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      DOCS_DISPATCH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
    steps:
      - name: Trigger docs hub rebuild
        if: env.DOCS_DISPATCH_TOKEN != ''
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer $DOCS_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/rostamlabs/docs/dispatches \
            -d '{"event_type":"rebuild-docs"}'
