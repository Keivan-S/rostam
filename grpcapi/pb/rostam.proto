syntax = "proto3";

// Package rostam.v1 is the gRPC surface over Rostam's vector/RAG operations.
// It mirrors the REST API (httpapi) and dispatches into the same op registry —
// a second transport, not new engine logic. The recursive metadata filter and
// the tagged metadata Value union are carried as JSON strings (filter_json /
// metadata_json / key_json) rather than re-modeled in protobuf, reusing the
// same JSON contract the binary wire codecs already use.
package rostam.v1;

option go_package = "github.com/rostamlabs/rostam/grpcapi/pb;pb";

service VectorService {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc CreateCollection(CreateCollectionRequest) returns (CreateCollectionResponse);
  rpc DropCollection(DropCollectionRequest) returns (DropCollectionResponse);
  rpc Upsert(UpsertRequest) returns (UpsertResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);

  // Get-by-id retrieves a dense point: its vector + payload + remaining TTL.
  // found=false is the not-found flag (absent/tombstoned/expired) — NOT a gRPC
  // error — so a partitioned point-op can distinguish "not in this partition".
  // with_vector/with_payload gate the two projections (both default true at the
  // edge). The four payload RPCs mutate a point's payload in place (no delete+
  // re-insert): SetPayload merges, OverwritePayload replaces the whole payload,
  // DeletePayloadKeys removes listed keys, ClearPayload empties it. applied=false
  // means the point was absent (→ NotFound at the edge).
  rpc Get(GetRequest) returns (GetResponse);
  // GetBatch retrieves MANY dense points by id in ONE op (the coordinator
  // scatters the ids to their owning partitions, asks each only for its subset,
  // and merges). A partial miss is NORMAL — absent ids come back in the missing
  // list, NEVER a NotFound error (unlike single Get). points carry their id so a
  // caller knows which point is which; with_vector/with_payload gate projections.
  rpc GetBatch(GetBatchRequest) returns (GetBatchResponse);
  rpc SetPayload(SetPayloadRequest) returns (PayloadResponse);
  rpc OverwritePayload(SetPayloadRequest) returns (PayloadResponse);
  rpc DeletePayloadKeys(DeletePayloadKeysRequest) returns (PayloadResponse);
  rpc ClearPayload(ClearPayloadRequest) returns (PayloadResponse);

  rpc Search(SearchRequest) returns (SearchResponse);
  rpc SearchDocs(SearchRequest) returns (SearchDocsResponse);
  rpc SearchGroups(SearchGroupsRequest) returns (SearchGroupsResponse);
  rpc HybridSearch(HybridRequest) returns (SearchResponse);
  // TextSearch runs a BM25 full-text search over a FullText collection: the server
  // tokenizes + scores the raw query text and returns enriched documents (content +
  // metadata), so it reuses SearchDocsResponse (like SearchDocs).
  rpc TextSearch(TextSearchRequest) returns (SearchDocsResponse);
  // HybridTextSearch fuses a dense KNN lane with a BM25 full-text lane (raw query
  // text analyzed server-side). Results carry the fused score + dense distance plus
  // the degraded/missing partition trailer — so it reuses SearchResponse (like
  // HybridSearch).
  rpc HybridTextSearch(HybridTextRequest) returns (SearchResponse);
  // VectorQuery runs the unified Query API (Qdrant-parity): a QuerySpec carries a
  // root leaf + N prefetch leaves + a combine mode (FUSION/RERANK) + fusion
  // config. v1 = the dense family, single-level. Results carry the fused/reranked
  // score + dense distance, plus the degraded/missing partition trailer — so it
  // reuses SearchResponse (like HybridSearch).
  rpc VectorQuery(VectorQueryRequest) returns (SearchResponse);
  // NamedVectorQuery runs the unified Query API over a NAMED collection: the same
  // QuerySpec (root + N prefetch leaves + FUSION/RERANK mode + fusion config), but
  // EVERY leaf targets a named vector SPACE (NamedDenseLeaf / NamedSparseLeaf), so
  // the N prefetch lanes fuse across >2 named spaces (the distinctive multi-space
  // value v1 dense cannot deliver). Mirrors VectorQuery: it reuses SearchResponse
  // (fused/reranked score + dense distance + the degraded/missing partition
  // trailer) and rides the vector_named_query op. Distinct RPC from VectorQuery
  // exactly as NamedHybridSearch is distinct from HybridSearch.
  rpc NamedVectorQuery(NamedVectorQueryRequest) returns (SearchResponse);
  // MVVectorQuery runs the unified Query API over a MULTI-VECTOR (late-interaction)
  // collection: the same QuerySpec (root + N prefetch leaves + FUSION/RERANK mode +
  // fusion config), but the leaves are MV-family leaves — a MaxSim leaf (MVMaxSimLeaf,
  // carrying the token query matrix) and/or the doc-level sparse field (SparseLeaf,
  // no space). Both MV lanes are score-descending. Mirrors VectorQuery /
  // NamedVectorQuery: it reuses SearchResponse (fused/reranked score + the
  // degraded/missing partition trailer) and rides the vector_mv_query op. Distinct
  // RPC exactly as MVHybridSearch is distinct from HybridSearch.
  rpc MVVectorQuery(MVVectorQueryRequest) returns (SearchResponse);
  rpc DeleteByFilter(DeleteByFilterRequest) returns (DeleteByFilterResponse);

  // Resplit re-partitions a collection offline (synchronous; quiesce writes
  // first). ResplitCleanup drops the orphaned pre-resplit partitions.
  rpc Resplit(ResplitRequest) returns (ResplitResponse);
  rpc ResplitCleanup(ResplitCleanupRequest) returns (ResplitCleanupResponse);

  // Reshard re-partitions a collection ONLINE (synchronous, but reads AND
  // writes stay live for the duration — no quiesce). The orchestrator dual-
  // writes to old+new gen during a streamed if-absent copy, then flips the
  // catalog at cutover. ReshardAbort aborts an in-flight reshard pre-cutover.
  rpc Reshard(ReshardRequest) returns (ReshardResponse);
  rpc ReshardAbort(ReshardAbortRequest) returns (ReshardAbortResponse);

  // Late interaction (multi-vector / ColBERT MaxSim).
  rpc MVCreateCollection(MVCreateRequest) returns (MVCreateResponse);
  rpc MVDropCollection(MVDropRequest) returns (MVDropResponse);
  rpc MVAdd(MVAddRequest) returns (MVAddResponse);
  rpc MVSearch(MVSearchRequest) returns (MVSearchResponse);
  // MVHybridSearch fuses an MV collection's MaxSim (late-interaction dense) lane
  // and its per-doc sparse lane into the top-k (cross-modality hybrid). Results
  // carry the fused score + dense distance, mirroring NamedHybridSearch — so it
  // reuses NamedSearchResponse.
  rpc MVHybridSearch(MVHybridRequest) returns (NamedSearchResponse);
  // MVScroll lists live multi-vector documents (id + payload, no token matrix)
  // with cursor pagination. Mirrors the dense Scroll / NamedScroll surface.
  rpc MVScroll(MVScrollRequest) returns (MVScrollResponse);
  rpc MVDelete(MVDeleteRequest) returns (MVDeleteResponse);

  // MV get-by-id + in-place payload mutation (see Get/SetPayload/.../ClearPayload
  // for the dense equivalents; MVGet returns the doc's token matrix instead of a
  // single vector). found/applied carry the not-found flag as above.
  rpc MVGet(MVGetRequest) returns (MVGetResponse);
  // MVGetBatch retrieves MANY multi-vector documents by id in ONE op (the
  // coordinator scatters the ids to their owning partitions, asks each only for
  // its subset, and merges). A partial miss is NORMAL — absent ids come back in
  // the missing list, NEVER a NotFound error (unlike single MVGet). The MV clone
  // of NamedGetBatch; each point carries its token matrix + payload (MV has NO
  // ttl).
  rpc MVGetBatch(MVGetBatchRequest) returns (MVGetBatchResponse);
  rpc MVSetPayload(SetPayloadRequest) returns (PayloadResponse);
  rpc MVOverwritePayload(SetPayloadRequest) returns (PayloadResponse);
  rpc MVDeletePayloadKeys(DeletePayloadKeysRequest) returns (PayloadResponse);
  rpc MVClearPayload(ClearPayloadRequest) returns (PayloadResponse);

  rpc MVResplit(ResplitRequest) returns (ResplitResponse);
  rpc MVResplitCleanup(ResplitCleanupRequest) returns (ResplitCleanupResponse);
  // Online reshard for multi-vector collections (see Reshard/ReshardAbort).
  rpc MVReshard(ReshardRequest) returns (ReshardResponse);
  rpc MVReshardAbort(ReshardAbortRequest) returns (ReshardAbortResponse);

  // Named vectors (Qdrant-style per-point multi-vector-space collections): a
  // collection holds a MAP of named dense vector spaces, each its own HNSW
  // index, sharing one per-point payload + id namespace. A point provides a map
  // of named vectors; a search selects which named space to query. Mirrors the
  // dense/MV transport surface; filter/metadata ride as JSON strings.
  rpc NamedCreate(NamedCreateRequest) returns (NamedCreateResponse);
  rpc NamedDrop(NamedDropRequest) returns (NamedDropResponse);
  rpc NamedUpsert(NamedUpsertRequest) returns (NamedUpsertResponse);
  rpc NamedSearch(NamedSearchRequest) returns (NamedSearchResponse);
  rpc NamedSparseSearch(NamedSparseSearchRequest) returns (NamedSearchResponse);
  rpc NamedHybridSearch(NamedHybridRequest) returns (NamedSearchResponse);
  rpc NamedSearchDocs(NamedSearchRequest) returns (NamedSearchDocsResponse);
  rpc NamedDelete(NamedDeleteRequest) returns (NamedDeleteResponse);

  // Named get-by-id + in-place payload mutation (see Get/SetPayload/.../
  // ClearPayload for the dense equivalents; NamedGet returns the per-point map of
  // named-space -> vector instead of a single vector). found/applied carry the
  // not-found flag as above. The payload is shared per point across spaces.
  rpc NamedGet(NamedGetRequest) returns (NamedGetResponse);
  // NamedGetBatch retrieves MANY named-vector points by id in ONE op (the
  // coordinator scatters the ids to their owning partitions, asks each only for
  // its subset, and merges). A partial miss is NORMAL — absent ids come back in
  // the missing list, NEVER a NotFound error (unlike single NamedGet). The named
  // clone of GetBatch; each point carries its per-space vectors map + payload +
  // ttl_ms.
  rpc NamedGetBatch(NamedGetBatchRequest) returns (NamedGetBatchResponse);
  rpc NamedSetPayload(SetPayloadRequest) returns (PayloadResponse);
  rpc NamedOverwritePayload(SetPayloadRequest) returns (PayloadResponse);
  rpc NamedDeletePayloadKeys(DeletePayloadKeysRequest) returns (PayloadResponse);
  rpc NamedClearPayload(ClearPayloadRequest) returns (PayloadResponse);

  rpc NamedScroll(NamedScrollRequest) returns (NamedScrollResponse);
  rpc Scroll(ScrollRequest) returns (ScrollResponse);
  rpc NamedGetConfig(NamedGetConfigRequest) returns (NamedGetConfigResponse);

  // Collection aliases (alias -> collection resolution + atomic swap). An alias
  // is a name that resolves to a real collection, so data-plane RPCs on the
  // alias transparently route to the target (resolution is in the engine). These
  // RPCs are the alias-MANAGEMENT surface. AliasBatch applies a list of create/
  // delete actions ATOMICALLY in one meta-Raft entry (the zero-downtime swap):
  // {delete prod, create prod->v2} repoints with no undefined intermediate
  // window. CreateAlias/DeleteAlias are single-action conveniences. ListAliases
  // is a local read (optional collection filter). Validation errors (target
  // missing / shadow / reserved char / target-is-alias) map to InvalidArgument.
  rpc CreateAlias(CreateAliasRequest) returns (CreateAliasResponse);
  rpc DeleteAlias(DeleteAliasRequest) returns (DeleteAliasResponse);
  rpc ListAliases(ListAliasesRequest) returns (ListAliasesResponse);
  rpc AliasBatch(AliasBatchRequest) returns (AliasBatchResponse);

  // Online key-admin (add/revoke/list API keys at RUNTIME, no restart). These are
  // admin-scope-gated coordinator virtual-ops (__keys_add__/__keys_revoke__/
  // __keys_list__) intercepted at the dispatcher and applied to the node's live
  // *vector.KeyRegistry (per-node-local in v1). The authorize gate classifies the
  // three op names as admin, so a non-admin caller is denied before the registry
  // is touched. SECURITY: KeysList returns ONLY the redacted view (fingerprint +
  // tenant + scopes + cert_cn) — the raw token is NEVER serialized at any edge;
  // KeysAdd/KeysRevoke return an empty ack and never echo the token.
  rpc KeysAdd(KeysAddRequest) returns (KeysAck);
  rpc KeysRevoke(KeysRevokeRequest) returns (KeysAck);
  rpc KeysList(KeysListRequest) returns (KeysListResponse);
}

// ---- named vectors ----

// NamedVectorList is one named space's vector value (a value in the per-point or
// query map). protobuf maps cannot hold a repeated value directly, so the repeated
// float is wrapped in a message. A space entry is dense XOR sparse: a DENSE space
// carries `values`; a SPARSE space carries `sparse_indices` + `sparse_values`
// (parallel arrays, sparse_indices strictly ascending). The two are mutually
// exclusive per entry — the engine fails loud on a modality mismatch
// (InvalidArgument). The sparse fields are ADDITIVE: a dense-only point leaves them
// empty (byte-identical to the pre-sparse wire).
message NamedVectorList {
  repeated float values = 1;
  repeated uint32 sparse_indices = 2;
  repeated float sparse_values = 3;
}

// NamedCreateRequest creates a named-vector collection. config_json is the
// map[string]NamedVectorParams (the named spaces + per-space index params),
// carried as JSON — the same contract the binary wire codec uses.
message NamedCreateRequest {
  string name = 1;
  string config_json = 2;
  // partitions is the collection-level partition count (0 or 1 = single-
  // partition; >1 splits the collection across shards via cross-shard fan-out,
  // like the dense/MV partitions field).
  int32 partitions = 3;
}
message NamedCreateResponse { string name = 1; }

message NamedDropRequest { string name = 1; }
message NamedDropResponse { string name = 1; }

// NamedUpsertRequest upserts a point: a map of named-space -> vector, plus the
// shared per-point payload (metadata_json) and ttl. A provided name must be a
// configured space; each vector's length must equal that space's dim.
message NamedUpsertRequest {
  string name = 1;
  uint64 id = 2;
  map<string, NamedVectorList> vectors = 3;
  string metadata_json = 4;
  int64 ttl_ms = 5;
  // Tunable write consistency (additive). write_consistency_factor=0 (default)
  // means "no barrier" (Raft majority, today's behavior); >0 requests that many
  // replicas of the target shard apply the write before returning (clamped to
  // [1,RF] at the barrier). no_wait (default false ⇒ wait=true) is the safe
  // default: a bool `wait` would default false in proto3 and invert the contract,
  // so the field is no_wait — set it true to return at majority without the
  // >majority barrier. See SetPayloadRequest for the full rationale.
  uint32 write_consistency_factor = 6;
  bool no_wait = 7;
  uint64 expected_version = 8;       // CAS precondition (see UpsertRequest)
  bool has_expected_version = 9;
  // ---- insert-time per-key payload TTL ----
  // key_ttl_ms maps a payload key -> RELATIVE time-to-live in milliseconds. At
  // insert/upsert the engine computes the ABSOLUTE deadline now+ttl for each key
  // (mirroring SetPayloadRequest.key_ttl_ms) and lazily drops the key once its
  // deadline passes, while the point itself lives on. Empty ⇒ no per-key TTL
  // (byte-identical to the pre-feature wire).
  map<string, int64> key_ttl_ms = 10;
}
message NamedUpsertResponse { uint64 id = 1; }

// NamedSearchRequest queries one named space (vector_name) of a named
// collection; filter_json (optional) is predicate-evaluated against the shared
// payload.
message NamedSearchRequest {
  string name = 1;
  string vector_name = 2;
  repeated float query = 3;
  int32 k = 4;
  string filter_json = 5;
  // 0=AnyReplica, 1=LeaderOnly, 2=Linearizable (readIndex barrier). >2 rejected.
  uint32 read_consistency = 6;
  uint32 on_partition_unavailable = 7;
  // max_staleness bounds replica lag (raft entries) behind the leader's committed
  // frontier; only meaningful when read_consistency==3 (bounded-staleness).
  uint64 max_staleness = 8;
}
message NamedResult { uint64 id = 1; float distance = 2; float score = 3; }
message NamedSearchResponse { repeated NamedResult results = 1; }

// NamedSparseSearchRequest queries one SPARSE named space (vector_name) of a named
// collection by sparse dot product. sparse_indices (strictly ascending) +
// sparse_values are the parallel sparse-query arrays. filter_json (optional) is
// predicate-evaluated against the shared payload. Results are ranked DESCENDING by
// sparse dot-product score (carried in NamedResult.score; distance is 0). A dense
// space rejects this with InvalidArgument (modality mismatch).
message NamedSparseSearchRequest {
  string name = 1;
  string vector_name = 2;
  repeated uint32 sparse_indices = 3;
  repeated float sparse_values = 4;
  int32 k = 5;
  string filter_json = 6;
  // 0=AnyReplica, 1=LeaderOnly, 2=Linearizable (readIndex barrier). >2 rejected.
  uint32 read_consistency = 7;
  uint32 on_partition_unavailable = 8;
  // max_staleness bounds replica lag (raft entries) behind the leader's committed
  // frontier; only meaningful when read_consistency==3 (bounded-staleness).
  uint64 max_staleness = 9;
}
// NamedHybridRequest fuses a DENSE named space (dense_space + dense) and a SPARSE
// named space (sparse_space + sparse_indices/sparse_values) of one named collection
// into the top-k, mirroring HybridRequest but across two named spaces. dense_space
// must be a configured dense space and sparse_space a configured sparse space (else
// InvalidArgument). An empty dense query degrades to the sparse lane only; empty
// sparse arrays degrade to the dense lane only. method "rrf" (default) or "weighted";
// alpha is the dense weight for weighted fusion. filter_json (optional) is
// predicate-evaluated against the shared payload in BOTH lanes. Results carry the
// fused score in NamedResult.score and the dense distance in NamedResult.distance.
message NamedHybridRequest {
  string name = 1;
  string dense_space = 2;
  repeated float dense = 3;
  string sparse_space = 4;
  repeated uint32 sparse_indices = 5;
  repeated float sparse_values = 6;
  int32 k = 7;
  string method = 8;
  double alpha = 9;
  int32 rrf_k = 10;
  int32 dense_k = 11;
  int32 sparse_k = 12;
  string filter_json = 13;
  // 0=AnyReplica, 1=LeaderOnly, 2=Linearizable (readIndex barrier). >2 rejected.
  uint32 read_consistency = 14;
  uint32 on_partition_unavailable = 15;
  // max_staleness bounds replica lag (raft entries) behind the leader's committed
  // frontier; only meaningful when read_consistency==3 (bounded-staleness).
  uint64 max_staleness = 16;
}

message NamedSearchDocsResponse { repeated Document documents = 1; }

message NamedDeleteRequest {
  string name = 1;
  uint64 id = 2;
  uint32 write_consistency_factor = 3;  // tunable write consistency (see NamedUpsertRequest)
  bool no_wait = 4;
  uint64 expected_version = 5;       // CAS precondition (see UpsertRequest)
  bool has_expected_version = 6;
}
message NamedDeleteResponse { bool deleted = 1; }

message NamedScrollRequest {
  string name = 1;
  int32 limit = 2;
  string filter_json = 3;
  string cursor = 4;
  // 0=AnyReplica, 1=LeaderOnly, 2=Linearizable (readIndex barrier). >2 rejected.
  uint32 read_consistency = 5;
  uint32 on_partition_unavailable = 6;
  // order_by paginates by an arbitrary NUMERIC or DATETIME payload field instead of
  // the default id-ascending order (Qdrant parity). Absent ⇒ id-ascending scroll.
  // Reuses the shared OrderBy message (see ScrollRequest).
  OrderBy order_by = 7;
  // max_staleness bounds replica lag (raft entries) behind the leader's committed
  // frontier; only meaningful when read_consistency==3 (bounded-staleness).
  uint64 max_staleness = 8;
}
message NamedScrollResponse { repeated Document documents = 1; string next_cursor = 2; }

// Dense scroll (cursor pagination). Mirrors the HTTP dense scroll route. cursor
// is an opaque pagination token (empty for the first page); next_cursor is empty
// once the collection is exhausted. degraded/missing report partition fan-out
// health (same shape as SearchResponse).
message ScrollRequest {
  string collection = 1;
  string filter_json = 2;
  int32 limit = 3;
  string cursor = 4;
  // 0=AnyReplica, 1=LeaderOnly, 2=Linearizable (readIndex barrier). >2 rejected.
  uint32 read_consistency = 5;
  uint32 on_partition_unavailable = 6;
  // order_by paginates by an arbitrary NUMERIC or DATETIME payload field instead of
  // the default id-ascending order (Qdrant parity). Absent ⇒ id-ascending scroll.
  OrderBy order_by = 7;
  // max_staleness bounds replica lag (raft entries) behind the leader's committed
  // frontier; only meaningful when read_consistency==3 (bounded-staleness).
  uint64 max_staleness = 8;
}

// OrderBy describes a scroll's payload-field ordering (numeric int/float or datetime).
// Shared by the dense / named / MV scroll requests. Missing-field points are EXCLUDED.
message OrderBy {
  string key = 1;                 // payload field path to order by (required when set)
  bool desc = 2;                  // descending on the field value (ascending otherwise)
  // start_from is an optional INCLUSIVE initial value bound (Qdrant start_from): for a
  // datetime field it may be an RFC3339 string (lowered to int-ms server-side) or a
  // numeric ms value; for a numeric field it is the numeric value. Encoded as a double
  // for numeric and as a string for datetime — exactly one is set.
  optional double start_from = 3;
  optional string start_from_datetime = 5;
  bool is_datetime = 4;           // the field is a datetime stored as unix-ms
  // is_string selects the lexicographic (stringValue, id) order_by path. Mutually-
  // exclusive with is_datetime and incompatible with start_from (both ⇒ InvalidArgument).
  // Additive: an unset is_string ⇒ the unchanged numeric/datetime path.
  bool is_string = 6;
  // tail_keys carry the SECONDARY/tertiary sort keys of a MULTI-KEY order_by: this
  // OrderBy is the PRIMARY (key[0]); tail_keys[0] is the 2nd key, [1] the 3rd, … The
  // full ordered key list is this message (without its own tail_keys) followed by
  // tail_keys. EMPTY/absent tail_keys ⇒ exactly the single-key path (BYTE/BEHAVIOUR-
  // IDENTICAL: a single-key order still emits a v2/v3 cursor, never v4). A non-empty
  // tail_keys switches the server onto the TUPLE-LEXICOGRAPHIC (k1,…,kN,id) total order
  // + the v4 cursor. Each tail key carries its own key/desc/is_datetime/is_string;
  // start_from / start_from_datetime are PRIMARY-ONLY and ignored on a tail key (a tail
  // key's own tail_keys, if any, are also ignored — the list is flat, one level deep).
  repeated OrderBy tail_keys = 7;
}
message ScrollResponse {
  repeated Document documents = 1;
  string next_cursor = 2;
  bool degraded = 3;
  repeated uint32 missing = 4;
}

message NamedGetConfigRequest {
  string name = 1;
  uint32 read_consistency = 2;        // 0=any (default), 1=leader, 2=linearizable
  uint32 on_partition_unavailable = 3; // 0=partial (default), 1=fail
  // max_staleness bounds replica lag (raft entries) behind the leader's committed
  // frontier; only meaningful when read_consistency==3 (bounded-staleness).
  uint64 max_staleness = 4;
}
// config_json is the map[string]NamedVectorParams JSON of the named collection.
message NamedGetConfigResponse { string name = 1; string config_json = 2; }

// TokenVector is one token-level vector (a row of a multi-vector document or
// query). protobuf has no nested repeated, so a matrix is a repeated TokenVector.
message TokenVector { repeated float values = 1; }

message MVConfig {
  int32 dim = 1;
  int32 m = 2;
  int32 ef_construction = 3;
  int32 ef_search = 4;
  int64 seed = 5;
  string quant = 6;          // "" / "none" | "sq8" | "bq1"
  int32 rescore_factor = 7;
  bool persistent = 8;       // mmap-backed, off-heap, durable
  int32 partitions = 9;
  // index_type selects the inner token index: "" / "hnsw" (default) or "ivf".
  // The IVF knobs below mirror the dense Config IVF fields and parameterize the
  // inner IVF-Flat / IVF-PQ index (compresses the dominant MV token memory). All
  // ignored unless index_type == "ivf". Absent/zero => byte-identical to the
  // pre-IVF MV create wire.
  string index_type = 10;
  int32 ivf_nlist = 11;
  int32 ivf_nprobe = 12;
  bool ivf_pq = 13;
  int32 ivf_pq_m = 14;
  bool ivf_rerank = 15;
  bool opq = 16;
  // ivf_train_threshold is the live token count at which the incrementally-built
  // quantized inner index (IVF coarse/residual, or HNSW-PQ codebooks)
  // deterministically auto-trains (0 = engine default).
  int32 ivf_train_threshold = 17;
  // ivf_drift_retrain / ivf_drift_growth_factor / ivf_drift_factor mirror the dense
  // Config drift-retrain knobs: the inner IVF token index opts into deterministic
  // auto-retrain-on-drift. Ignored unless index_type == "ivf". Factors must be > 1.0
  // (0 = default). Absent/false => byte-identical to the prior MV create wire.
  bool ivf_drift_retrain = 19;
  double ivf_drift_growth_factor = 20;
  double ivf_drift_factor = 21;
  // pq_drop_vecs (HNSW-PQ only, quant == "pq") drops the resident float token
  // vectors once the incrementally-built inner HNSW-PQ index auto-trains, leaving
  // only the M-byte codes resident (maximum compression, ADC-only first stage).
  // Requires quant == "pq". Absent/false => byte-identical to the prior MV wire.
  bool pq_drop_vecs = 18;
  // filter_first_relative_bp mirrors the dense Config knob: the opt-in relative
  // selectivity gate (basis points of the live DOCUMENT count, 0..10000; 0 = off =
  // byte-identical). Absent/0 => byte-identical to the prior MV create wire.
  int32 filter_first_relative_bp = 22;
  // opq_iters mirrors the dense Config knob: full-OPQ iterative Procrustes
  // refinement on the inner token index (0 = 1 = v1 behavior, byte-identical;
  // > 1 = that many refine iterations). Ignored unless opq is set. Must be in
  // [0, 20]. Absent/0 => byte-identical to the prior MV create wire.
  int32 opq_iters = 23;
}
message MVCreateRequest { string name = 1; MVConfig config = 2; }
message MVCreateResponse { string name = 1; }

message MVDropRequest { string name = 1; }
message MVDropResponse { string name = 1; }

message MVAddRequest {
  string name = 1;
  uint64 id = 2;
  repeated TokenVector tokens = 3;
  string metadata_json = 4;
  uint32 write_consistency_factor = 5;  // tunable write consistency (see NamedUpsertRequest)
  bool no_wait = 6;
  uint64 expected_version = 7;       // CAS precondition (see UpsertRequest)
  bool has_expected_version = 8;
  // ---- add-time per-key payload TTL ----
  // key_ttl_ms maps a payload key -> RELATIVE time-to-live in milliseconds. At add
  // the engine computes the ABSOLUTE deadline now+ttl for each key (mirroring
  // SetPayloadRequest.key_ttl_ms) and lazily drops the key once its deadline passes,
  // while the document itself lives on. Empty ⇒ no per-key TTL (byte-identical to
  // the pre-feature wire).
  map<string, int64> key_ttl_ms = 9;
  // ---- optional doc-level sparse vector (additive) ----
  // sparse_indices / sparse_values describe ONE optional doc-level sparse vector
  // carried alongside the dense token matrix (the MV analogue of a named point's
  // sparse space; consumed by MV hybrid search in a later feature). indices MUST be
  // strictly ascending + unique, and len(indices) == len(values). Both empty ⇒
  // dense-only (byte-identical to the pre-sparse wire — no add trailer, no persist
  // block). Mirrors NamedHybridRequest.sparse_indices/values.
  repeated uint32 sparse_indices = 10;
  repeated float  sparse_values  = 11;
}
message MVAddResponse { uint64 id = 1; }

message MVSearchRequest {
  string name = 1;
  repeated TokenVector query = 2;
  int32 k = 3;
  int32 candidates_per_token = 4;
  // 0=AnyReplica, 1=LeaderOnly, 2=Linearizable (readIndex barrier). >2 rejected.
  uint32 read_consistency = 5;
  uint32 on_partition_unavailable = 6;
  // filter_json (optional) is a JSON-encoded vector.Filter, predicate-evaluated
  // against each candidate's payload in the MaxSim rerank (mirrors SearchRequest).
  string filter_json = 7;
  // max_staleness bounds replica lag (raft entries) behind the leader's committed
  // frontier; only meaningful when read_consistency==3 (bounded-staleness).
  uint64 max_staleness = 8;
}
message MVResult { uint64 id = 1; float score = 2; string metadata_json = 3; }
message MVSearchResponse { repeated MVResult results = 1; bool degraded = 2; repeated uint32 missing = 3; }

// MVHybridRequest fuses an MV collection's MaxSim lane (the token query matrix) and
// its per-doc sparse lane (sparse_indices/sparse_values) into the top-k, mirroring
// NamedHybridRequest but within one MV collection (no two space names — the MaxSim
// tokens and the doc sparse vector live in the same collection). An empty query
// matrix degrades to the sparse lane only; empty sparse arrays degrade to the MaxSim
// lane only. method "rrf" (default) or "weighted"; alpha is the MaxSim-lane weight
// for weighted fusion. filter_json (optional) is predicate-evaluated against the
// payload in BOTH lanes. Results carry the fused score in NamedResult.score.
message MVHybridRequest {
  string name = 1;
  repeated TokenVector query = 2;
  repeated uint32 sparse_indices = 3;
  repeated float sparse_values = 4;
  int32 k = 5;
  string method = 6;
  double alpha = 7;
  int32 rrf_k = 8;
  int32 dense_k = 9;
  int32 sparse_k = 10;
  string filter_json = 11;
  // 0=AnyReplica, 1=LeaderOnly, 2=Linearizable (readIndex barrier). >2 rejected.
  uint32 read_consistency = 12;
  uint32 on_partition_unavailable = 13;
  // max_staleness bounds replica lag (raft entries) behind the leader's committed
  // frontier; only meaningful when read_consistency==3 (bounded-staleness).
  uint64 max_staleness = 14;
}

// MV scroll (cursor pagination). Mirrors ScrollRequest/ScrollResponse for the
// multi-vector op family: cursor is an opaque pagination token (empty for the
// first page); next_cursor is empty once the collection is exhausted.
// degraded/missing report partition fan-out health (same shape as
// MVSearchResponse).
message MVScrollRequest {
  string collection = 1;
  string filter_json = 2;
  int32 limit = 3;
  string cursor = 4;
  // 0=AnyReplica, 1=LeaderOnly, 2=Linearizable (readIndex barrier). >2 rejected.
  uint32 read_consistency = 5;
  uint32 on_partition_unavailable = 6;
  // order_by paginates by an arbitrary NUMERIC or DATETIME payload field instead of
  // the default id-ascending order (Qdrant parity). Absent ⇒ id-ascending scroll.
  // Reuses the shared OrderBy message (see ScrollRequest).
  OrderBy order_by = 7;
  // max_staleness bounds replica lag (raft entries) behind the leader's committed
  // frontier; only meaningful when read_consistency==3 (bounded-staleness).
  uint64 max_staleness = 8;
}
message MVScrollResponse {
  repeated Document documents = 1;
  string next_cursor = 2;
  bool degraded = 3;
  repeated uint32 missing = 4;
}

message MVDeleteRequest {
  string name = 1;
  uint64 id = 2;
  uint32 write_consistency_factor = 3;  // tunable write consistency (see NamedUpsertRequest)
  bool no_wait = 4;
  uint64 expected_version = 5;       // CAS precondition (see UpsertRequest)
  bool has_expected_version = 6;
}
message MVDeleteResponse { bool deleted = 1; }

message HealthRequest {}
message HealthResponse { string status = 1; }

// Config carries the friendly create-collection knobs. metric is
// "cosine"|"l2"|"dot"; quant is ""|"none"|"sq8"|"bq1"|"pq"|"sq"|"prq". Zero
// m/ef_* take the standard HNSW defaults server-side.
message Config {
  int32 dim = 1;
  string metric = 2;
  int32 m = 3;
  int32 ef_construction = 4;
  int32 ef_search = 5;
  int64 seed = 6;
  string quant = 7;
  bool persistent = 8;
  int32 rescore_factor = 9;
  int32 partitions = 10;
  // index_type selects the backing index: "" / "hnsw" (default) or "ivf".
  string index_type = 11;
  // ivf_nlist / ivf_nprobe parameterize an IVF-Flat index (0 = engine default).
  int32 ivf_nlist = 12;
  int32 ivf_nprobe = 13;
  // IVF-PQ (residual product quantization): ivf_pq enables compact PQ codes +
  // ADC scoring on an IVF index; ivf_pq_m is the sub-quantizer count (0 = engine
  // default; dim must divide it); ivf_rerank keeps full vectors for an exact
  // rescore of the ADC shortlist. All ignored unless index_type == "ivf".
  bool ivf_pq = 14;
  int32 ivf_pq_m = 15;
  bool ivf_rerank = 16;
  // PQ-HNSW (quant == "pq"): quant_pq_m is the PQ sub-quantizer count for a dense
  // HNSW index (0 = engine default; dim must divide it). Ignored unless quant ==
  // "pq". Distinct from ivf_pq_m, which drives PQ on an IVF index.
  int32 quant_pq_m = 17;
  // opq enables an OPQ orthogonal rotation R (d×d) applied inside the PQ codec
  // before sub-quantization, balancing the sub-space variance for higher recall
  // at the same M/nbits. Requires a PQ mode (ivf_pq, or quant == "pq"); rejected
  // otherwise. Default false.
  bool opq = 18;
  // pq_drop_vecs (HNSW-PQ only, quant == "pq") drops the resident float vectors
  // after the bulk build for maximum compression (ADC-only search). Requires
  // quant == "pq"; rejected otherwise. Default false.
  bool pq_drop_vecs = 19;
  // ivf_train_threshold is the live-vector count at which an incrementally-built
  // IVF index (index_type == "ivf") deterministically auto-trains its coarse
  // quantizer (and, for IVF-PQ, the residual codebooks). 0 = engine default.
  // Ignored unless index_type == "ivf". Mirrors MVConfig.ivf_train_threshold.
  int32 ivf_train_threshold = 20;
  // ivf_drift_retrain opts an IVF index into deterministic auto-retrain-on-drift:
  // after the first auto-train, a two-stage (growth-checkpoint then drift-metric)
  // trigger retrains the coarse quantizer when the live distribution drifts away
  // from the centroids. ivf_drift_growth_factor (default 2.0) is the geometric
  // live-count multiple between O(1) checkpoints; ivf_drift_factor (default 1.5) is
  // how far the mean nearest-centroid distance must exceed its train-time reference
  // before a retrain fires. Both must be > 1.0 (0 = default). Ignored unless
  // index_type == "ivf". Absent/false => byte-identical to the prior create wire.
  bool ivf_drift_retrain = 21;
  double ivf_drift_growth_factor = 22;
  double ivf_drift_factor = 23;
  // filter_first_relative_bp is the OPT-IN relative selectivity gate (basis points
  // of the live collection size, 0..10000; 0 = off = byte-identical absolute
  // behavior). When > 0 the effective filter-first materialization limit becomes
  // max(absThreshold, min(relativeBP*liveCount/10000, 1_000_000)), so a relatively-
  // selective filter uses exact filter-first beyond the absolute cap. Absent/0 =>
  // byte-identical to the prior create wire.
  int32 filter_first_relative_bp = 24;
  // opq_iters drives full-OPQ iterative Procrustes refinement (Ge et al. 2013).
  // Ignored unless opq is set. 0 (default) means 1 = the v1 single-random-rotation
  // behavior, byte-identical to before. A value > 1 runs that many
  // train→reconstruct→solve-rotation→re-rotate iterations, lowering PQ
  // reconstruction error on imbalanced data. Must be in [0, 20]. The refinement is
  // deterministic (fixed Jacobi SVD), so replicas converge to identical codebooks.
  // Absent/0 => byte-identical to the prior create wire.
  int32 opq_iters = 25;
  // full_text, when set, enables the server-side BM25 full-text lane: each
  // upserted record's reserved $content is tokenized + indexed so TextSearch and
  // HybridTextSearch work. Absent => no full-text lane (byte-identical to the
  // prior create wire). See FullTextConfig.
  FullTextConfig full_text = 26;
  // sq_bits is the TRAINED scalar quantizer's bit-depth for quant == "sq": 4, 6,
  // or 8 (0 = engine default 8). Ignored unless quant == "sq". Absent/0 =>
  // byte-identical to the prior create wire.
  int32 sq_bits = 27;
  // prq_layers is the product-residual quantization layer count for quant == "prq"
  // (0 = engine default 2; per-vector code = prq_layers*quant_pq_m bytes). Ignored
  // unless quant == "prq". Absent/0 => byte-identical to the prior create wire.
  int32 prq_layers = 28;
  // vamana_r / vamana_l / vamana_alpha parameterize a Vamana (DiskANN) index
  // (index_type == "vamana"): vamana_r is the max out-degree (0 = engine default
  // 64), vamana_l the build/search beam width (0 = default 100), vamana_alpha the
  // pass-2 RobustPrune α (0 = default 1.2). Ignored unless index_type == "vamana".
  // Absent/0 => byte-identical to the prior create wire.
  int32 vamana_r = 29;
  int32 vamana_l = 30;
  float vamana_alpha = 31;
  // anisotropic_eta / soar / soar_lambda / pq_nbits expose the ScaNN-style
  // anisotropic PQ loss + IVF multi-assignment + 4-bit fast-scan knobs:
  // anisotropic_eta is the score-aware PQ weight (η ≥ 1; 0/1 = isotropic L2,
  // byte-identical); soar opts an IVF index into multi-assignment; soar_lambda is
  // the SOAR orthogonality-amplification weight λ (0 = engine default 1.5); pq_nbits
  // is the per-subspace PQ code width (0/8 = 8-bit default, 4 = 4-bit LUT16).
  // Absent/0/false => byte-identical to the prior create wire.
  float anisotropic_eta = 32;
  bool soar = 33;
  float soar_lambda = 34;
  int32 pq_nbits = 35;
}
// FullTextConfig enables + parameterizes the BM25 full-text lane.
message FullTextConfig {
  string analyzer = 1; // registered analyzer name; "" = "english"
  float k1 = 2;        // BM25 tf-saturation; 0 = 1.2
  float b = 3;         // BM25 length-norm; 0 = 0.75
}
message CreateCollectionRequest { string name = 1; Config config = 2; }
message CreateCollectionResponse { string name = 1; }

message DropCollectionRequest { string name = 1; }
message DropCollectionResponse { string name = 1; }

// UpsertRequest inserts (upsert=false, rejects duplicates) or upserts
// (upsert=true, the RAG write path storing content) a point.
message UpsertRequest {
  string collection = 1;
  uint64 id = 2;
  repeated float vector = 3;
  string content = 4;
  int64 ttl_ms = 5;
  string metadata_json = 6;
  repeated uint32 sparse_indices = 7;
  repeated float sparse_values = 8;
  bool upsert = 9;
  uint32 write_consistency_factor = 10;  // tunable write consistency (see SetPayloadRequest)
  bool no_wait = 11;
  // ---- optimistic concurrency (CAS) ----
  // expected_version is the per-point version the caller expects the point to
  // currently have; the write applies ONLY when it matches (0 = expect the point
  // to be absent/new — an insert-if-absent CAS). It is enforced ONLY when
  // has_expected_version is true; absent (the proto-zero) ⇒ an unconditional write
  // (byte-identical to the pre-feature wire). A mismatch is FailedPrecondition.
  uint64 expected_version = 12;
  bool has_expected_version = 13;
  // ---- insert-time per-key payload TTL ----
  // key_ttl_ms maps a payload key -> RELATIVE time-to-live in milliseconds. At
  // insert/upsert the engine computes the ABSOLUTE deadline now+ttl for each key
  // (mirroring SetPayloadRequest.key_ttl_ms) and lazily drops the key once its
  // deadline passes, while the point itself lives on. Empty ⇒ no per-key TTL
  // (byte-identical to the pre-feature wire).
  map<string, int64> key_ttl_ms = 14;
}
message UpsertResponse { uint64 id = 1; }

message DeleteRequest {
  string collection = 1;
  uint64 id = 2;
  uint32 write_consistency_factor = 3;  // tunable write consistency (see SetPayloadRequest)
  bool no_wait = 4;
  uint64 expected_version = 5;       // CAS precondition (see UpsertRequest)
  bool has_expected_version = 6;
}
message DeleteResponse { bool deleted = 1; }

message SearchRequest {
  string collection = 1;
  repeated float query = 2;
  int32 k = 3;
  string filter_json = 4;
  // 0=AnyReplica, 1=LeaderOnly, 2=Linearizable (readIndex barrier). >2 rejected.
  uint32 read_consistency = 5;
  uint32 on_partition_unavailable = 6;
  // max_staleness bounds replica lag (raft entries) behind the leader's committed
  // frontier; only meaningful when read_consistency==3 (bounded-staleness).
  uint64 max_staleness = 7;
}
message Result { uint64 id = 1; float distance = 2; float score = 3; }
message SearchResponse { repeated Result results = 1; bool degraded = 2; repeated uint32 missing = 3; repeated Group groups = 4; }

message Document {
  uint64 id = 1;
  float distance = 2;
  float score = 3;
  string content = 4;
  string metadata_json = 5;
}
message SearchDocsResponse { repeated Document documents = 1; bool degraded = 2; repeated uint32 missing = 3; }

message SearchGroupsRequest {
  string collection = 1;
  repeated float query = 2;
  int32 k = 3;
  string group_by = 4;
  int32 group_size = 5;
  int32 fetch_k = 6;
  string filter_json = 7;
  // 0=AnyReplica, 1=LeaderOnly, 2=Linearizable (readIndex barrier). >2 rejected.
  uint32 read_consistency = 8;
  uint32 on_partition_unavailable = 9;
  // max_staleness bounds replica lag (raft entries) behind the leader's committed
  // frontier; only meaningful when read_consistency==3 (bounded-staleness).
  uint64 max_staleness = 10;
}
message Group { string key_json = 1; repeated Document hits = 2; }
message SearchGroupsResponse { repeated Group groups = 1; bool degraded = 2; repeated uint32 missing = 3; }

message HybridRequest {
  string collection = 1;
  repeated float dense = 2;
  int32 k = 3;
  repeated uint32 sparse_indices = 4;
  repeated float sparse_values = 5;
  string filter_json = 6;
  string method = 7;
  double alpha = 8;
  int32 rrf_k = 9;
  int32 dense_k = 10;
  int32 sparse_k = 11;
  // 0=AnyReplica, 1=LeaderOnly, 2=Linearizable (readIndex barrier). >2 rejected.
  uint32 read_consistency = 12;
  uint32 on_partition_unavailable = 13;
  // max_staleness bounds replica lag (raft entries) behind the leader's committed
  // frontier; only meaningful when read_consistency==3 (bounded-staleness).
  uint64 max_staleness = 14;
}

// TextSearchRequest is a BM25 full-text search: the server tokenizes + scores
// the RAW query text (the client ships no tokens). Returns SearchDocsResponse
// (content + metadata documents), like SearchDocs. Requires a FullText collection.
message TextSearchRequest {
  string collection = 1;
  string text = 2;
  int32 k = 3;
  string filter_json = 4;
  // 0=AnyReplica, 1=LeaderOnly, 2=Linearizable (readIndex barrier). >2 rejected.
  uint32 read_consistency = 5;
  uint32 on_partition_unavailable = 6;
  // max_staleness bounds replica lag (raft entries) behind the leader's committed
  // frontier; only meaningful when read_consistency==3 (bounded-staleness).
  uint64 max_staleness = 7;
  // global_idf opts into the BM25 global-DF (dfs_query_then_fetch) two-phase text
  // search across partitions. Default false ⇒ the existing per-shard-local-IDF
  // fast path. Single-partition collections ignore the flag.
  bool global_idf = 8;
}

// HybridTextRequest fuses a dense KNN lane with a BM25 full-text lane. The text
// lane is RAW query text the server analyzes (no sparse query rides the wire).
// Returns SearchResponse (fused score + dense distance), like HybridSearch.
message HybridTextRequest {
  string collection = 1;
  repeated float dense = 2;
  string text = 3;
  int32 k = 4;
  string filter_json = 5;
  string method = 6;
  double alpha = 7;
  int32 rrf_k = 8;
  int32 dense_k = 9;
  int32 sparse_k = 10;
  // 0=AnyReplica, 1=LeaderOnly, 2=Linearizable (readIndex barrier). >2 rejected.
  uint32 read_consistency = 11;
  uint32 on_partition_unavailable = 12;
  // max_staleness bounds replica lag (raft entries) behind the leader's committed
  // frontier; only meaningful when read_consistency==3 (bounded-staleness).
  uint64 max_staleness = 13;
  // global_idf opts into the BM25 global-DF (dfs_query_then_fetch) two-phase text
  // lane across partitions. Default false ⇒ the existing per-shard-local-IDF fast
  // path. Affects only the BM25 text lane.
  bool global_idf = 14;
}

message DeleteByFilterRequest {
  string collection = 1;
  string filter_json = 2;
  // Tunable write consistency for this fan-out delete (see SetPayloadRequest).
  // The barrier applies PER touched partition shard; the first under-replicated
  // shard surfaces the error (each delete is independently durable at majority).
  uint32 write_consistency_factor = 3;
  bool no_wait = 4;
}
message DeleteByFilterResponse { int32 deleted = 1; }

// Resplit messages are shared by the dense (Resplit/ResplitCleanup) and MV
// (MVResplit/MVResplitCleanup) RPCs — the RPC selects dense vs MV.
message ResplitRequest { string name = 1; int32 new_partitions = 2; }
message ResplitResponse { string name = 1; int32 new_partitions = 2; }
message ResplitCleanupRequest { string name = 1; }
message ResplitCleanupResponse { string name = 1; int32 dropped = 2; }

// Reshard messages are shared by the dense (Reshard/ReshardAbort) and MV
// (MVReshard/MVReshardAbort) RPCs — the RPC selects dense vs MV. Abort is
// name-only (the in-flight reshard's target is read from the catalog).
message ReshardRequest { string name = 1; int32 new_partitions = 2; }
message ReshardResponse { string name = 1; int32 new_partitions = 2; }
message ReshardAbortRequest { string name = 1; }
message ReshardAbortResponse { string name = 1; }

// ---- get-by-id + in-place payload mutation ----
//
// The three payload-mutation request messages and PayloadResponse are SHARED by
// the dense (SetPayload/...), named (NamedSetPayload/...), and MV
// (MVSetPayload/...) RPCs — the RPC name selects the family. The Get request/
// response messages are per-family because the vector projection differs (a
// single dense vector, a map of named vectors, or a token matrix).

// GetRequest fetches a dense point by id. with_vector/with_payload gate the two
// projections (both default true at the edge).
message GetRequest {
  string collection = 1;
  uint64 id = 2;
  bool with_vector = 3;
  bool with_payload = 4;
  uint32 read_consistency = 5;        // 0=any (default), 1=leader, 2=linearizable
  uint32 on_partition_unavailable = 6; // 0=partial (default), 1=fail
  // max_staleness bounds replica lag (raft entries) behind the leader's committed
  // frontier; only meaningful when read_consistency==3 (bounded-staleness).
  uint64 max_staleness = 7;
}
// GetResponse carries the dense point. found=false is the not-found flag
// (absent/tombstoned/expired); vector/payload_json/ttl_ms are empty then or when
// the projection was off. payload_json is the tagged metadata Value-union JSON.
message GetResponse {
  bool found = 1;
  repeated float vector = 2;
  string payload_json = 3;
  int64 ttl_ms = 4;
  uint64 version = 5;  // per-point CAS version (>=1 for a found point); read-then-CAS-write
}

message GetBatchRequest {
  string collection = 1;
  repeated uint64 ids = 2;
  bool with_vector = 3;
  bool with_payload = 4;
}
// BatchGetPoint is one PRESENT point in a GetBatch result: its id plus the same
// projected fields a single GetResponse carries (vector / payload_json / ttl_ms).
// Absent ids are NOT here — they appear in GetBatchResponse.missing. The id is
// required (unlike GetResponse) so a batch caller knows which point is which.
// (Document carries distance/score/content for SEARCH hits and has no vector/ttl,
// so a dedicated message mirrors the raw point projection that single Get exposes.)
message BatchGetPoint {
  uint64 id = 1;
  repeated float vector = 2;
  string payload_json = 3;
  int64 ttl_ms = 4;
  uint64 version = 5;  // per-point CAS version (>=1)
}
// GetBatchResponse carries the found points + the ids that were absent. A partial
// miss is normal: missing is just the not-found set, never a NotFound error.
message GetBatchResponse {
  repeated BatchGetPoint points = 1;
  repeated uint64 missing = 2;
}

// SetPayloadRequest is shared by the merge (SetPayload) and replace
// (OverwritePayload) RPCs across all three families. payload_json is the tagged
// metadata Value-union JSON (empty = empty payload).
message SetPayloadRequest {
  string collection = 1;
  uint64 id = 2;
  string payload_json = 3;
  // ---- tunable write consistency (additive, shared across all WRITE requests) ----
  // write_consistency_factor: how many replicas of the target shard's Raft group
  // must have APPLIED this write before it returns. 0 (default) = no barrier,
  // i.e. return at Raft majority (byte-identical to pre-feature behavior); >0
  // requests that many applied replicas, CLAMPED to [1,RF] at the barrier (a
  // value > the deployment's replication factor is not an error, it clamps). A
  // value <= majority is a free no-op (you already get majority).
  //
  // no_wait: the field is named no_wait (NOT wait) on purpose. proto3 bools
  // default to false; the API contract is wait DEFAULTS TO TRUE. A `bool wait`
  // would decode an absent field as false ⇒ skip-barrier, silently inverting the
  // safe default for every old/zero request. no_wait inverts cleanly: absent ⇒
  // false ⇒ wait=true (block until the factor is met or timeout). Set no_wait=true
  // to return as soon as Raft commits at majority and skip the >majority barrier.
  uint32 write_consistency_factor = 4;
  bool no_wait = 5;
  // key_ttl_ms: OPTIONAL per-key payload TTL (key -> RELATIVE ms). On set/overwrite
  // the engine computes the absolute deadline (now+ms) and the key is lazily
  // dropped on reads once it expires; the point itself is unaffected. Absent/empty
  // = no per-key TTL (byte-identical to the pre-feature wire). Honored by the
  // set_payload/overwrite_payload RPCs across all three families (dense, named, MV).
  map<string, int64> key_ttl_ms = 6;
  uint64 expected_version = 7;       // CAS precondition (see UpsertRequest)
  bool has_expected_version = 8;
}
// DeletePayloadKeysRequest removes the listed keys (absent keys = no-op). Shared
// across all three families.
message DeletePayloadKeysRequest {
  string collection = 1;
  uint64 id = 2;
  repeated string keys = 3;
  uint32 write_consistency_factor = 4;  // tunable write consistency (see SetPayloadRequest)
  bool no_wait = 5;
  uint64 expected_version = 6;       // CAS precondition (see UpsertRequest)
  bool has_expected_version = 7;
}
// ClearPayloadRequest empties a point's payload. Shared across all three families.
message ClearPayloadRequest {
  string collection = 1;
  uint64 id = 2;
  uint32 write_consistency_factor = 3;  // tunable write consistency (see SetPayloadRequest)
  bool no_wait = 4;
  uint64 expected_version = 5;       // CAS precondition (see UpsertRequest)
  bool has_expected_version = 6;
}
// PayloadResponse is the result of any payload mutation: applied=false is the
// not-found flag (the point was absent/tombstoned/expired) → NotFound at the
// edge. Shared across all three families.
message PayloadResponse { bool applied = 1; }

// NamedGetRequest fetches a named point by id (the per-point map of named-space
// -> vector + shared payload).
message NamedGetRequest {
  string collection = 1;
  uint64 id = 2;
  bool with_vector = 3;
  bool with_payload = 4;
  uint32 read_consistency = 5;        // 0=any (default), 1=leader, 2=linearizable
  uint32 on_partition_unavailable = 6; // 0=partial (default), 1=fail
  // max_staleness bounds replica lag (raft entries) behind the leader's committed
  // frontier; only meaningful when read_consistency==3 (bounded-staleness).
  uint64 max_staleness = 7;
}
// NamedGetResponse carries the named point. vectors maps each space the point has
// to its vector (omitted spaces absent; empty when with_vector off).
message NamedGetResponse {
  bool found = 1;
  map<string, NamedVectorList> vectors = 2;
  string payload_json = 3;
  int64 ttl_ms = 4;
  uint64 version = 5;  // per-point CAS version (>=1 for a found point); read-then-CAS-write
}

// NamedGetBatchRequest fetches MANY named-vector points by id in one op. The
// named clone of GetBatchRequest.
message NamedGetBatchRequest {
  string collection = 1;
  repeated uint64 ids = 2;
  bool with_vector = 3;
  bool with_payload = 4;
}
// NamedBatchGetPoint is one PRESENT point in a NamedGetBatch result: its id plus
// the same projected fields a single NamedGetResponse carries (the per-space
// vectors map / payload_json / ttl_ms). Absent ids are NOT here — they appear in
// NamedGetBatchResponse.missing. The named clone of BatchGetPoint.
message NamedBatchGetPoint {
  uint64 id = 1;
  map<string, NamedVectorList> vectors = 2;
  string payload_json = 3;
  int64 ttl_ms = 4;
  uint64 version = 5;  // per-point CAS version (>=1)
}
// NamedGetBatchResponse carries the found points + the ids that were absent. A
// partial miss is normal: missing is just the not-found set, never a NotFound
// error. The named clone of GetBatchResponse.
message NamedGetBatchResponse {
  repeated NamedBatchGetPoint points = 1;
  repeated uint64 missing = 2;
}

// MVGetRequest fetches a multi-vector document by id (its token matrix + payload).
message MVGetRequest {
  string collection = 1;
  uint64 id = 2;
  bool with_vector = 3;
  bool with_payload = 4;
  uint32 read_consistency = 5;        // 0=any (default), 1=leader, 2=linearizable
  uint32 on_partition_unavailable = 6; // 0=partial (default), 1=fail
  // max_staleness bounds replica lag (raft entries) behind the leader's committed
  // frontier; only meaningful when read_consistency==3 (bounded-staleness).
  uint64 max_staleness = 7;
}
// MVGetResponse carries the document. tokens is the token matrix (empty when
// with_vector off). MV documents have no TTL.
message MVGetResponse {
  bool found = 1;
  repeated TokenVector tokens = 2;
  string payload_json = 3;
  uint64 version = 4;  // per-document CAS version (>=1 for a found doc); read-then-CAS-write
}

// MVGetBatchRequest fetches MANY multi-vector documents by id in one op. The MV
// clone of NamedGetBatchRequest.
message MVGetBatchRequest {
  string collection = 1;
  repeated uint64 ids = 2;
  bool with_vector = 3;
  bool with_payload = 4;
}
// MVBatchGetPoint is one PRESENT point in an MVGetBatch result: its id plus the
// same projected fields a single MVGetResponse carries (the token matrix /
// payload_json). Absent ids are NOT here — they appear in
// MVGetBatchResponse.missing. MV has NO ttl. The MV clone of NamedBatchGetPoint.
message MVBatchGetPoint {
  uint64 id = 1;
  repeated TokenVector tokens = 2;
  string payload_json = 3;
  uint64 version = 4;  // per-document CAS version (>=1)
}
// MVGetBatchResponse carries the found points + the ids that were absent. A
// partial miss is normal: missing is just the not-found set, never a NotFound
// error. The MV clone of NamedGetBatchResponse.
message MVGetBatchResponse {
  repeated MVBatchGetPoint points = 1;
  repeated uint64 missing = 2;
}

// ---- collection aliases ----

// CreateAliasRequest points an alias at a real collection (upsert: an existing
// alias of the same name is overwritten). Lowers to a single-action AliasBatch.
message CreateAliasRequest {
  string alias = 1;
  string collection = 2;
}
message CreateAliasResponse {
  string alias = 1;
  string collection = 2;
}

// DeleteAliasRequest removes an alias. Absent alias is a no-op (idempotent).
message DeleteAliasRequest { string alias = 1; }
message DeleteAliasResponse { string alias = 1; }

// ListAliasesRequest lists all aliases; collection (optional) filters to aliases
// whose target == collection. The list is a local FSM read (no Raft).
message ListAliasesRequest { string collection = 1; }
// AliasEntry is one alias -> collection pair in the list response.
message AliasEntry {
  string alias = 1;
  string collection = 2;
}
message ListAliasesResponse { repeated AliasEntry aliases = 1; }

// AliasAction is one mutation in an atomic batch. delete=true removes alias;
// otherwise alias is created/overwritten to point at collection.
message AliasAction {
  string alias = 1;
  string collection = 2;
  bool delete = 3;
}
// AliasBatchRequest applies actions ATOMICALLY in one meta-Raft entry (the
// zero-downtime swap). A swap is [{delete prod}, {create prod->v2}].
message AliasBatchRequest { repeated AliasAction actions = 1; }
message AliasBatchResponse { int32 applied = 1; }

// --- Unified Query API (prefetch + fusion/rerank) ---
//
// A QuerySpec is the message-only spec for the unified vector_query op (Qdrant
// parity Query API). It carries a ROOT query plus N single-level PREFETCH
// sub-queries (leaves), combined at the root by either FUSION (RRF/Weighted/DBSF
// over the prefetch lanes) or RERANK (the root re-scores the union of the
// prefetch candidates). v1 = the DENSE family, single-level (no recursion); the
// leaf types are dense + sparse. These messages are carried as marshaled bytes
// inside the vector_query op args (NOT a dedicated RPC in Task 1 — the VectorQuery
// RPC is added in a later task). The recursive metadata filter is carried as a
// JSON string (filter_json), reusing the same JSON contract the binary wire
// codecs already use.

// QueryMode selects how the root combines the prefetch lanes.
enum QueryMode {
  // FUSION fuses the N prefetch lanes via the configured fusion method. The
  // "root" in this mode is just the fusion config; the lanes are the prefetch
  // leaves.
  QUERY_MODE_FUSION = 0;
  // RERANK re-scores the UNION of the prefetch candidate ids by the ROOT leaf
  // (a dense or sparse query) restricted to that candidate set, returning the
  // reranked top-k.
  QUERY_MODE_RERANK = 1;
}

// DenseLeaf is a dense (float vector) query node. k is the leaf's own top-k
// (the per-leaf result size); lane_k is the per-lane candidate pool the engine
// pulls before fusion/rerank (0 = the engine default max(k,50)). filter_json is
// the optional metadata filter for this leaf (same JSON contract as hybrid).
message DenseLeaf {
  repeated float dense = 1;
  int32 k = 2;
  string filter_json = 3;
  int32 lane_k = 4;
}

// SparseLeaf is a sparse (indices/values) query node. Mirrors DenseLeaf's k /
// lane_k / filter_json. indices must be strictly ascending and unique (same
// SparseVector contract as the hybrid wire).
message SparseLeaf {
  repeated uint32 indices = 1;
  repeated float values = 2;
  int32 k = 3;
  string filter_json = 4;
  int32 lane_k = 5;
}

// NamedDenseLeaf is a dense query node targeting a NAMED vector space (the
// named-collection Query API). space names the configured DENSE space to query;
// the remaining fields mirror DenseLeaf (k / filter_json / lane_k).
message NamedDenseLeaf {
  string space = 1;
  repeated float dense = 2;
  int32 k = 3;
  string filter_json = 4;
  int32 lane_k = 5;
}

// NamedSparseLeaf is a sparse query node targeting a NAMED vector space. space
// names the configured SPARSE space; indices/values are the sparse query (same
// SparseVector contract as SparseLeaf); k / filter_json / lane_k mirror
// SparseLeaf.
message NamedSparseLeaf {
  string space = 1;
  repeated uint32 indices = 2;
  repeated float values = 3;
  int32 k = 4;
  string filter_json = 5;
  int32 lane_k = 6;
}

// MVMaxSimLeaf is a multi-vector late-interaction (MaxSim) query node for the MV
// family Query API. query is the token query matrix (each TokenVector is one
// query token; the same [][]float32 wire MVSearchRequest carries). k / lane_k /
// filter_json mirror DenseLeaf. An MV query's MaxSim leaf carries this arm; the
// MV doc-level sparse field REUSES SparseLeaf (a SparseLeaf inside an MV query =
// the doc sparse index — no space). Both MV leaf orientations are SCORE-desc
// (MaxSim relevance + sparse dot product), unlike the distance-asc dense lane.
message MVMaxSimLeaf {
  repeated TokenVector query = 1;
  int32 k = 2;
  string filter_json = 3;
  int32 lane_k = 4;
}

// RecommendLeaf is a RECOMMEND query node (Qdrant-parity, v1 AVERAGE_VECTOR,
// DENSE family): search by positive/negative EXAMPLE point-ids. The coordinator
// resolves the example ids to their stored vectors, derives the query vector
// normalize(mean(positive) - mean(negative)) (metric-aware), REWRITES this leaf
// into a DenseLeaf, then the existing dense pipeline runs. positive must carry at
// least one id present in the collection (the derive needs a mean). negative is
// optional (steers away). k / filter_json mirror DenseLeaf (lane_k is derived
// from k after the rewrite). The example ids are EXCLUDED from the results.
// RecommendStrategy selects how a recommend leaf scores candidates (Qdrant-parity):
// AVERAGE_VECTOR (0, default) derives ONE query vector mean(positive)-mean(negative)
// → a DenseLeaf (the existing path — byte-identical); BEST_SCORE (1) scores each
// candidate by a custom max-similarity merge over the positive/negative example
// vectors (a real per-candidate scorer, like DiscoverLeaf — score-descending). The
// coordinator resolves the example ids to vectors and, for BEST_SCORE, embeds them
// in best_pos / best_neg.
enum RecommendStrategy {
  RECOMMEND_AVERAGE_VECTOR = 0;
  RECOMMEND_BEST_SCORE = 1;
}

message RecommendLeaf {
  repeated uint64 positive = 1;
  repeated uint64 negative = 2;
  int32 k = 3;
  string filter_json = 4;
  // strategy selects AVERAGE_VECTOR (default 0) vs BEST_SCORE (1). Additive: a v1
  // client omits it (0) and gets the byte-identical AVERAGE_VECTOR path.
  RecommendStrategy strategy = 5;
  // best_pos / best_neg are the RESOLVED positive/negative example VECTORS for the
  // BEST_SCORE strategy (the coordinator resolves the ids cluster-wide and embeds
  // them, like DiscoverLeaf.context), so each partition runs the best-score scorer
  // without re-resolving ids. Empty for AVERAGE_VECTOR.
  repeated TokenVector best_pos = 6;
  repeated TokenVector best_neg = 7;
  // space names the target NAMED vector space (the named family): empty ⇒ a
  // dense-collection recommend leaf (rejected if it carries a space — dense
  // recommend is space-less); non-empty ⇒ a per-space named recommend leaf
  // (resolved + scored against that configured space with the space's metric).
  // Additive message-only field (grpc.pb.go unchanged): a v1 client omits it.
  string space = 8;
}

// ContextPair is one RESOLVED discover constraint: the positive/negative example
// VECTORS (floats). The coordinator resolves the context-pair ids → stored
// vectors and embeds them here, so each partition's discover scorer ranks
// candidates by the pair directional term without re-resolving ids.
message ContextPair {
  repeated float positive = 1;
  repeated float negative = 2;
}

// ContextPairIDs is one UNRESOLVED discover constraint: the positive/negative
// example POINT-IDS. The client supplies the pair as ids; the coordinator
// resolves them to vectors (ContextPair) before the discover execLeaf runs.
message ContextPairIDs {
  uint64 positive = 1;
  uint64 negative = 2;
}

// DiscoverLeaf is a DISCOVER query node (Qdrant-parity, v1 DENSE family): a
// target + context positive/negative example PAIRS guide a CUSTOM per-candidate
// scorer (each pair contributes a directional term; the target seeds the
// candidate pool). Unlike RecommendLeaf (which derives ONE query vector → a
// DenseLeaf), discover is a real execLeaf with a per-candidate score, score-
// descending (like MVMaxSimLeaf). It carries BOTH the RESOLVED vectors (target /
// context as floats, what the execLeaf consumes) AND the UNRESOLVED ids
// (target_id / context_ids, the input the coordinator resolves into the float
// fields). The single-node path resolves the ids locally; the cluster
// coordinator batch-gets them cluster-wide and embeds the vectors ONCE. k is the
// final top-k; filter_json is the optional metadata filter. v1 is dense-only (a
// Space-bearing/MV discover leaf is rejected fail-loud).
message DiscoverLeaf {
  repeated float target = 1;
  repeated ContextPair context = 2;
  int32 k = 3;
  string filter_json = 4;
  repeated uint64 target_id = 5;
  repeated ContextPairIDs context_ids = 6;
  // space names the target NAMED vector space (the named family): empty ⇒ a
  // dense-collection discover leaf (rejected if it carries a space — dense
  // discover is space-less); non-empty ⇒ a per-space named discover leaf
  // (resolved + scored against that configured space with the space's metric).
  // Additive message-only field (grpc.pb.go unchanged): a v1 client omits it.
  string space = 7;
}

// QueryLeaf is one query node: exactly one of a dense / sparse leaf (the dense
// family), a named-space dense / sparse leaf (the named family), a multi-
// vector MaxSim leaf (the MV family; the MV doc sparse field reuses SparseLeaf),
// a recommend leaf (the dense family; derived to a DenseLeaf at the
// coordinator), or a discover leaf (the dense family; a custom per-candidate
// context-pair scorer, coordinator-resolved).
message QueryLeaf {
  oneof leaf {
    DenseLeaf dense = 1;
    SparseLeaf sparse = 2;
    NamedDenseLeaf named_dense = 3;
    NamedSparseLeaf named_sparse = 4;
    MVMaxSimLeaf mv_maxsim = 5;
    RecommendLeaf recommend = 6;
    DiscoverLeaf discover = 7;
  }
}

// QuerySource is one prefetch source in the (bounded) query tree: EITHER a flat
// QueryLeaf (the unchanged 1-level path — every dense/named/MV/recommend/discover
// query uses leaf sources) OR a nested QuerySpec (a full sub-query whose own
// fused/reranked top-k becomes the parent's lane — Qdrant multi-stage retrieval).
// Exactly one arm is set. The leaf variant is field 1 so a leaf source is the
// minimal/default form; the spec variant (field 2) is recursive (self-referential
// via QuerySpec.prefetch_sources), bounded by a decode-time depth limit
// (maxQueryDepth) for anti-DoS.
message QuerySource {
  oneof source {
    QueryLeaf leaf = 1;
    QuerySpec spec = 2;
  }
}

// QuerySpec is the full unified query: a root leaf, N prefetch sources, the
// combine mode, the fusion config, and the final top-k. The collection lives in
// the op header (NOT duplicated here).
//
// WIRE / BACK-COMPAT: the 1-level flat form rides `repeated QueryLeaf prefetch`
// (field 2) UNCHANGED — a v1 client (and every existing leaf-only query) marshals
// byte-identically, and the codec decodes the flat field into []QuerySource{leaf}.
// NESTED trees ride the additive `repeated QuerySource prefetch_sources` (field 8):
// the codec encodes a spec to `prefetch_sources` ONLY when some source is a nested
// QuerySpec; a leaf-only spec still encodes to the flat `prefetch` field so the v1
// wire stays byte-identical. The decoder prefers `prefetch_sources` when present,
// else falls back to the flat `prefetch`.
message QuerySpec {
  QueryLeaf root = 1;
  // Flat 1-level prefetch leaves (the v1 wire — kept byte-identical). A leaf-only
  // spec encodes here; the decoder lifts each into a QuerySource{leaf}.
  repeated QueryLeaf prefetch = 2;
  QueryMode mode = 3;
  // fusion config (FUSION mode): method is "rrf" (default), "weighted", or
  // "dbsf"; alpha is the dense weight in [0,1] for weighted/dbsf; rrf_k is the
  // RRF constant (0 = default 60).
  string fusion_method = 4;
  double alpha = 5;
  int32 rrf_k = 6;
  // k is the final top-k returned by the root (after fusion or rerank).
  int32 k = 7;
  // Nested prefetch tree (additive): a QuerySource is EITHER a leaf or a nested
  // QuerySpec. Present (non-empty) ONLY for nested queries; when set it SUPERSEDES
  // `prefetch`. A leaf-only spec leaves this empty and uses `prefetch` (v1 wire).
  repeated QuerySource prefetch_sources = 8;
  // group_by / group_size (additive): when group_by is non-empty the query is a
  // GROUPED query — the final ordered top pool is collapsed by the group_by
  // metadata field into the top-k GROUPS (ranked by best member), each with up to
  // group_size hits (mirrors SearchGroupsRequest). Empty group_by ⇒ the existing
  // flat-results path (byte/behaviour-identical). Dense-only in v1.
  string group_by = 9;
  uint32 group_size = 10;
}

// VectorQueryRequest is the unified Query API request: a collection plus a
// QuerySpec (root/prefetch/mode/fusion/k) plus the standard read-consistency
// fields. The collection lives here (NOT in the spec); the gRPC server marshals
// the embedded QuerySpec into the vector_query op's spec blob. Mirrors
// HybridRequest's read_consistency / on_partition_unavailable / max_staleness.
message VectorQueryRequest {
  string collection = 1;
  QuerySpec spec = 2;
  // 0=AnyReplica, 1=LeaderOnly, 2=Linearizable (readIndex barrier). >2 rejected.
  uint32 read_consistency = 3;
  uint32 on_partition_unavailable = 4;
  // max_staleness bounds replica lag (raft entries) behind the leader's committed
  // frontier; only meaningful when read_consistency==3 (bounded-staleness).
  uint64 max_staleness = 5;
}

// NamedVectorQueryRequest is the named-collection Query API request: a named
// collection plus a QuerySpec whose leaves each carry a named vector space
// (NamedDenseLeaf / NamedSparseLeaf), plus the standard read-consistency fields.
// The same field layout as VectorQueryRequest (the spec carries the named leaves);
// the gRPC server marshals the embedded QuerySpec into the vector_named_query op's
// spec blob. Mirrors VectorQueryRequest's read_consistency /
// on_partition_unavailable / max_staleness.
message NamedVectorQueryRequest {
  string collection = 1;
  QuerySpec spec = 2;
  // 0=AnyReplica, 1=LeaderOnly, 2=Linearizable (readIndex barrier). >2 rejected.
  uint32 read_consistency = 3;
  uint32 on_partition_unavailable = 4;
  // max_staleness bounds replica lag (raft entries) behind the leader's committed
  // frontier; only meaningful when read_consistency==3 (bounded-staleness).
  uint64 max_staleness = 5;
}

// MVVectorQueryRequest is the multi-vector-collection Query API request: an MV
// collection plus a QuerySpec whose leaves carry MV-family payloads (the MaxSim
// token matrix via the mv_maxsim arm and/or the doc sparse field via the sparse
// arm — no space), plus the standard read-consistency fields. The same field
// layout as VectorQueryRequest / NamedVectorQueryRequest (the spec carries the MV
// leaves); the gRPC server marshals the embedded QuerySpec into the vector_mv_query
// op's spec blob.
message MVVectorQueryRequest {
  string collection = 1;
  QuerySpec spec = 2;
  // 0=AnyReplica, 1=LeaderOnly, 2=Linearizable (readIndex barrier). >2 rejected.
  uint32 read_consistency = 3;
  uint32 on_partition_unavailable = 4;
  // max_staleness bounds replica lag (raft entries) behind the leader's committed
  // frontier; only meaningful when read_consistency==3 (bounded-staleness).
  uint64 max_staleness = 5;
}

// --- Online key-admin (add/revoke/list API keys at runtime) ---

// KeysAddRequest registers a new API key on the live registry. The raw token is a
// SECRET consumed by the registry and never echoed back in any response. tenant is
// required (multi-tenant isolation); scopes is the permission set (e.g. "read",
// "write", "admin"); cert_cn optionally binds the key to an mTLS client CN.
message KeysAddRequest {
  string token = 1;
  string tenant = 2;
  repeated string scopes = 3;
  string cert_cn = 4;
}

// KeysRevokeRequest removes an API key by its raw token. The token rides in the
// request body (never a URL/path on the HTTP edge) so the secret is not logged in
// access logs. After this returns the token no longer authenticates.
message KeysRevokeRequest { string token = 1; }

// KeysListRequest takes no parameters (list all registered keys, redacted).
message KeysListRequest {}

// RedactedKey is one token-free entry in a KeysList response. SECURITY: there is
// NO token field — the registry replaces the raw token with its sha256
// fingerprint, so a list response can never carry the secret by construction.
message RedactedKey {
  string fingerprint = 1;
  string tenant = 2;
  repeated string scopes = 3;
  string cert_cn = 4;
}

// KeysListResponse is the redacted snapshot of the registry (fingerprint + tenant
// + scopes + cert_cn per key; never the raw token).
message KeysListResponse { repeated RedactedKey keys = 1; }

// KeysAck is the empty success acknowledgement for KeysAdd/KeysRevoke. It
// deliberately carries no fields (never the token) — a successful return is the
// only signal the caller needs.
message KeysAck {}
