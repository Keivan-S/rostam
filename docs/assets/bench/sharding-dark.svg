<text class="ttl" x="66" y="26">Sharding and scale-out — PUT, 3-node PB RF=2</text>
<text class="sub" x="66" y="43">Shard count is not a throughput lever; the 2-&gt;3 node step is (see note).</text>
<line x1="66" y1="334.0" x2="628" y2="334.0" stroke="#33322e" stroke-width="1"/><text class="ax" x="57" y="338.0" text-anchor="end">0</text><line x1="66" y1="266.9" x2="628" y2="266.9" stroke="#33322e" stroke-width="1"/><text class="ax" x="57" y="270.9" text-anchor="end">100</text><line x1="66" y1="199.7" x2="628" y2="199.7" stroke="#33322e" stroke-width="1"/><text class="ax" x="57" y="203.7" text-anchor="end">200</text><line x1="66" y1="132.6" x2="628" y2="132.6" stroke="#33322e" stroke-width="1"/><text class="ax" x="57" y="136.6" text-anchor="end">300</text><line x1="66" y1="65.4" x2="628" y2="65.4" stroke="#33322e" stroke-width="1"/><text class="ax" x="57" y="69.4" text-anchor="end">400</text><text class="ax" x="57" y="42" text-anchor="end">k ops/s</text><text class="ax" x="136.2" y="354" text-anchor="middle">4 shards</text><rect x="114.2" y="112.8" width="44.0" height="221.2" fill="#3987e5" rx="4" ry="4"/><text class="lb" x="136.2" y="106.8" text-anchor="middle">329.4</text><text class="ax" x="276.8" y="354" text-anchor="middle">8</text><rect x="254.8" y="101.5" width="44.0" height="232.5" fill="#3987e5" rx="4" ry="4"/><text class="lb" x="276.8" y="95.5" text-anchor="middle">346.3</text><text class="ax" x="417.2" y="354" text-anchor="middle">16</text><rect x="395.2" y="108.6" width="44.0" height="225.4" fill="#3987e5" rx="4" ry="4"/><text class="lb" x="417.2" y="102.6" text-anchor="middle">335.7</text><text class="ax" x="557.8" y="354" text-anchor="middle">32</text><rect x="535.8" y="99.5" width="44.0" height="234.5" fill="#3987e5" rx="4" ry="4"/><text class="lb" x="557.8" y="93.5" text-anchor="middle">349.3</text><text class="ax" x="347.0" y="372" text-anchor="middle">shards per cluster</text><text class="an" x="66" y="390">4-&gt;8 buys ~5%, then flat. Node scale-out 2-&gt;3 at constant RF=2: 190k -&gt; 357k (1.88x for 1.5x nodes).</text></svg>